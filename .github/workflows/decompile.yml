name: Decompile preserved plugin DLLs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'binaries/**'
      - '.github/workflows/decompile.yml'

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install ILSpy command line
        run: dotnet tool install --global ilspycmd
      - name: Reconstruct C# from original binaries
        run: |
          mkdir -p reference-decompiled/RequestMovie reference-decompiled/NfoTrailer
          ilspycmd -p -o reference-decompiled/RequestMovie "binaries/Request Movie_0.1.0.111/Jellyfin.Plugin.RequestMovie.dll"
          ilspycmd -p -o reference-decompiled/NfoTrailer "binaries/NFO Trailer_0.1.0.10/Jellyfin.Plugin.Trailer.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: decompiled-original-plugin-sources
          path: reference-decompiled/
      - name: Commit decompiled reference code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-decompiled/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve ILSpy C# decompilation of original installed plugins"
          git push origin HEAD:main
